<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Scanner PWA - Reliable</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB1XoJBa-yTi9VvUA_HDr4XLoqoS818pKo",
      authDomain: "barcode-scanner-eb374.firebaseapp.com",
      projectId: "barcode-scanner-eb374",
      storageBucket: "barcode-scanner-eb374.firebasestorage.app",
      messagingSenderId: "86790131288",
      appId: "1:86790131288:web:ea5dc8ccc1fdacedef042d"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
  </script>
</head>
<body>
  <div class="top-bar">
    <h1>Inventory Scanner</h1>
    <button onclick="toggleDark()">🌙</button>
    <button onclick="clearAllScans()" class="clear-btn">Clear All</button>
  </div>

  <div id="scanner-wrapper">
    <div id="scanner"></div>
    <div class="scanner-overlay"><div class="scan-line"></div></div>
  </div>

  <input type="text" id="search-box" placeholder="Search items">
  <select id="category-filter">
    <option value="">All categories</option>
    <option value="Other">Other</option>
  </select>

  <div id="scanned-items"></div>
  <button class="fab" onclick="startScanner()">+</button>

  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

  <script>
    let scannedItems = {};

    // Dark mode
    function toggleDark() {
      document.body.classList.toggle('dark');
      localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    }
    if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');

    // Firebase Anonymous Login
    auth.signInAnonymously()
      .then(() => {
        console.log('Signed in anonymously, UID:', auth.currentUser.uid);
        loadScans();
      })
      .catch(err => console.error('Anonymous sign-in failed:', err));

    // Save scan to Firestore with debug
    function saveScanToFirebase(code) {
      const item = scannedItems[code];
      if (!auth.currentUser) {
        console.error("Cannot save scan: No user signed in!");
        return;
      }

      db.collection('scans').doc(code).set({
        quantity: item.quantity,
        category: item.category,
        notes: item.notes || '',
        timestamp: item.timestamp,
        user: auth.currentUser.uid
      })
      .then(() => console.log("Saved to Firestore:", code))
      .catch(err => console.error("Error saving scan:", err));
    }

    // Load scans from Firestore with real-time updates
    function loadScans() {
      if (!auth.currentUser) return;
      db.collection('scans')
        .where('user', '==', auth.currentUser.uid)
        .onSnapshot(snapshot => {
          snapshot.forEach(doc => scannedItems[doc.id] = doc.data());
          updateTable();
        }, err => console.error("Error loading scans:", err));
    }

    // Scanner settings
    let lastScanTime = 0;
    const scanCooldown = 1000; // 1 second
    const minGoodMatches = 3;  // confidence check
    const requireConfirmation = true;

    function startScanner() {
      Quagga.init({
        inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#scanner'), constraints: { facingMode: "environment" } },
        decoder: { readers: ["ean_reader","upc_reader"] }
      }, err => {
        if (err) { console.error(err); return; }
        Quagga.start();
      });

      Quagga.onDetected(data => {
        const now = Date.now();
        if (now - lastScanTime < scanCooldown) return; // debounce
        lastScanTime = now;

        const code = data.codeResult.code;
        const goodMatches = data.codeResult.decodedCodes.filter(c => c.error !== undefined && c.error < 0.2);
        if (goodMatches.length < minGoodMatches) {
          console.log("Ignored low confidence scan:", code);
          return;
        }

        if (requireConfirmation) {
          const confirmed = confirm("Add barcode: " + code + "?");
          if (!confirmed) return;
        }

        if (!scannedItems[code]) {
          scannedItems[code] = {
            quantity: 1,
            category: 'Other',
            notes: '',
            timestamp: new Date().toLocaleString()
          };
          updateTable();
          saveScanToFirebase(code);
          localStorage.setItem('scannedItems', JSON.stringify(scannedItems));
          console.log("Barcode added:", code);
        }
      });
    }

    // Update UI
    function updateTable() {
      const container = document.getElementById('scanned-items');
      container.innerHTML = '';

      const searchTerm = document.getElementById('search-box')?.value.toLowerCase().trim() || '';
      const filterCat = document.getElementById('category-filter')?.value || '';

      for (const code in scannedItems) {
        const item = scannedItems[code];
        const notes = item.notes ? item.notes.toLowerCase() : '';

        if ((searchTerm && !code.toLowerCase().includes(searchTerm) && !notes.includes(searchTerm)) ||
            (filterCat && item.category !== filterCat)) continue;

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <strong>${code}</strong>
          <div class="item-meta">Quantity: <span class="item-edit" onclick="editQuantity('${code}')">${item.quantity}</span></div>
          <div class="item-meta">Category: <span class="item-edit" onclick="editCategory('${code}')">${item.category}</span></div>
          <div class="item-meta">Notes: <span class="item-edit" onclick="editNotes('${code}')">${item.notes || 'Tap to add'}</span></div>
          <div class="item-meta">${item.timestamp}</div>
        `;
        container.appendChild(card);
      }
    }

    // Edit functions
    function editQuantity(code) {
      const newQty = prompt("Enter new quantity:", scannedItems[code].quantity);
      if (newQty !== null) {
        scannedItems[code].quantity = parseInt(newQty);
        updateTable();
        saveScanToFirebase(code);
        localStorage.setItem('scannedItems', JSON.stringify(scannedItems));
      }
    }
    function editCategory(code) {
      const newCat = prompt("Enter new category:", scannedItems[code].category);
      if (newCat !== null) {
        scannedItems[code].category = newCat;
        updateTable();
        saveScanToFirebase(code);
        localStorage.setItem('scannedItems', JSON.stringify(scannedItems));
      }
    }
    function editNotes(code) {
      const newNotes = prompt("Enter notes:", scannedItems[code].notes);
      if (newNotes !== null) {
        scannedItems[code].notes = newNotes;
        updateTable();
        saveScanToFirebase(code);
        localStorage.setItem('scannedItems', JSON.stringify(scannedItems));
      }
    }

    // Clear all scans
    function clearAllScans() {
      if (!confirm("Are you sure you want to clear all items? This cannot be undone.")) return;

      scannedItems = {};
      updateTable();
      localStorage.removeItem('scannedItems');

      if (auth.currentUser) {
        const userId = auth.currentUser.uid;
        db.collection('scans').where('user', '==', userId).get()
          .then(snapshot => {
            snapshot.forEach(doc => doc.ref.delete().catch(err => console.error("Error deleting doc:", err)));
          })
          .catch(err => console.error("Error fetching docs for deletion:", err));
      }
    }

    // Load localStorage fallback
    window.addEventListener('load', () => {
      const stored = localStorage.getItem('scannedItems');
      if (stored) scannedItems = JSON.parse(stored);
      updateTable();
    });
  </script>
</body>
</html>
