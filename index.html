<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Scanner PWA</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
  </script>
</head>
<body>
  <!-- Top bar -->
  <div class="top-bar">
    <h1>Inventory Scanner</h1>
    <button class="toggle-dark" onclick="toggleDark()">🌙</button>
  </div>

  <!-- Scanner -->
  <div id="scanner-wrapper">
    <div id="scanner"></div>
    <div class="scanner-overlay">
      <div class="scan-line"></div>
    </div>
  </div>

  <!-- Search & Category Filter -->
  <input type="text" id="search-box" placeholder="Search items">
  <select id="category-filter">
    <option value="">All categories</option>
    <option value="Other">Other</option>
  </select>

  <!-- Inventory Cards -->
  <div id="scanned-items"></div>

  <!-- Floating Scan Button -->
  <button class="fab" onclick="startScanner()">+</button>

  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

  <script>
    // ===== GLOBAL VARIABLES =====
    let scannedItems = {};

    // ===== DARK MODE =====
    function toggleDark() {
      document.body.classList.toggle('dark');
      localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    }
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark');
    }

    // ===== FIREBASE ANONYMOUS LOGIN =====
    auth.signInAnonymously()
      .then(() => {
        console.log('Signed in anonymously');
        loadScans();
      })
      .catch(err => console.error(err));

    // ===== FIRESTORE FUNCTIONS =====
    function saveScanToFirebase(code) {
      const item = scannedItems[code];
      if (!auth.currentUser) return;
      db.collection('scans').doc(code).set({
        quantity: item.quantity,
        category: item.category,
        notes: item.notes || '',
        timestamp: item.timestamp,
        user: auth.currentUser.uid
      }).then(() => console.log('Scan saved:', code))
        .catch(err => console.error(err));
    }

    function loadScans() {
      if (!auth.currentUser) return;
      db.collection('scans')
        .where('user', '==', auth.currentUser.uid)
        .onSnapshot(snapshot => {
          snapshot.forEach(doc => {
            scannedItems[doc.id] = doc.data();
          });
          updateTable();
        }, err => console.error(err));
    }

    // ===== SCANNER =====
    function startScanner() {
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#scanner'),
          constraints: {
            facingMode: "environment"
          }
        },
        decoder: {
          readers: ["code_128_reader","ean_reader","ean_8_reader","code_39_reader","upc_reader"]
        }
      }, function(err) {
        if (err) { console.error(err); return; }
        Quagga.start();
      });

      Quagga.onDetected(data => {
        const code = data.codeResult.code;
        if (!scannedItems[code]) {
          scannedItems[code] = {
            quantity: 1,
            category: 'Other',
            notes: '',
            timestamp: new Date().toLocaleString()
          };
          updateTable();
          saveScanToFirebase(code);
          localStorage.setItem('scannedItems', JSON.stringify(scannedItems));
        }
      });
    }

    // ===== UPDATE TABLE =====
    function updateTable() {
      const container = document.getElementById('scanned-items');
      container.innerHTML = '';

      const searchInput = document.getElementById('search-box');
      const categoryInput = document.getElementById('category-filter');

      const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const filterCat = categoryInput ? categoryInput.value : '';

      for (const code in scannedItems) {
        const item = scannedItems[code];
        const notes = item.notes ? item.notes.toLowerCase() : '';

        if (
          (searchTerm &&
           !code.toLowerCase().includes(searchTerm) &&
           !notes.includes(searchTerm)) ||
          (filterCat && item.category !== filterCat)
        ) {
          continue;
        }

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <strong>${code}</strong>
          <div class="item-meta">
            Quantity: <span class="item-edit" onclick="editQuantity('${code}', this)">${item.quantity}</span>
          </div>
          <div class="item-meta">
            Category: <span class="item-edit" onclick="editCategory('${code}', this)">${item.category}</span>
          </div>
          <div class="item-meta">
            Notes: <span class="item-edit" onclick="editNotes('${code}', this)">${item.notes || 'Tap to add'}</span>
          </div>
          <div class="item-meta">${item.timestamp}</div>
        `;
        container.appendChild(card);
      }
    }

    // ===== EDIT FUNCTIONS =====
    function editQuantity(code, el) {
      const newQty = prompt("Enter new quantity:", scannedItems[code].quantity);
      if (newQty !== null) {
        scannedItems[code].quantity = parseInt(newQty);
        updateTable();
        saveScanToFirebase(code);
        localStorage.setItem('scannedItems', JSON.stringify(scannedItems));
      }
    }

    function editCategory(code, el) {
      const newCat = prompt("Enter new category:", scannedItems[code].category);
      if (newCat !== null) {
        scannedItems[code].category = newCat;
        updateTable();
        saveScanToFirebase(code);
        localStorage.setItem('scannedItems', JSON.stringify(scannedItems));
      }
    }

    function editNotes(code, el) {
      const newNotes = prompt("Enter notes:", scannedItems[code].notes);
      if (newNotes !== null) {
        scannedItems[code].notes = newNotes;
        updateTable();
        saveScanToFirebase(code);
        localStorage.setItem('scannedItems', JSON.stringify(scannedItems));
      }
    }

    // ===== LOAD LOCALSTORAGE FALLBACK =====
    window.addEventListener('load', () => {
      const stored = localStorage.getItem('scannedItems');
      if (stored) scannedItems = JSON.parse(stored);
      updateTable();
    });
  </script>
</body>
</html>
